    <!--
      Theme before first paint.

      The theme is a per-account setting that lives behind /api/app/meta, which
      cannot answer until the bundle has run - by which time a dark-mode reader
      has already been shown a white page. So the last applied theme is mirrored
      into localStorage and replayed here, synchronously, before the stylesheet
      or any script loads. The app re-applies the authoritative value when meta
      arrives, and overwrites this key whenever the theme changes.

      Deliberately duplicated with THEME_STORAGE_KEY in hooks/useSession.jsx: an
      inline script cannot import from the bundle it is racing.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('salah-theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored);
          }
          // Accent palette: same replay so a reload does not flash the default
          // teal before /api/app/meta answers. The ids are duplicated with
          // ACCENT_IDS in services/accent.js; green is the :root default and
          // therefore needs no attribute.
          var accent = localStorage.getItem('salah-accent');
          if (['blue', 'violet', 'gold', 'rose', 'ocean'].indexOf(accent) !== -1) {
            document.documentElement.setAttribute('data-accent', accent);
          }
          // Typography preferences replay the same trick: the app font id and
          // the two text-size percents are mirrored by the shell when they
          // arrive from /api/app/meta, and replayed here before the stylesheet
          // loads so a reload keeps the chosen face and sizes. The keys are
          // duplicated with APP_FONT/APP_SCALE/QURAN_SCALE_STORAGE_KEY in
          // App.jsx, exactly like salah-theme above.
          var appFont = localStorage.getItem('salah-appfont');
          if (appFont) {
            document.documentElement.setAttribute('data-app-font', appFont);
          }
          var appScale = parseFloat(localStorage.getItem('salah-appscale'));
          if (appScale > 0) {
            document.documentElement.style.setProperty('--app-font-scale', String(appScale / 100));
          }
          var quranScale = parseFloat(localStorage.getItem('salah-qscale'));
          if (quranScale > 0) {
            document.documentElement.style.setProperty('--quran-font-scale', String(quranScale / 100));
          }
        } catch (err) {
          /* Storage can throw in private mode. The default theme still applies. */
        }
      })();
    </script>
    <!-- Bootstrap. The React app uses .form-floating, .d-flex,
         .justify-content-between, .gap-2, .text-muted, .bg-light, .p-2 and
         .table across several pages, but the React entry point never loaded it -
         only views/navbar.ejs did. That is why form labels sat beside the
         inputs instead of floating inside them. Same version as before, now
         served from this deployment: a CDN stylesheet is render-blocking, and
         on a slow mobile connection it delayed first paint by seconds. -->
    <link href="/vendor/bootstrap.min.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Icons are self-hosted (public/fonts, declared in the app stylesheet):
         Google Fonts' copy of Material Symbols arrives with the UI stylesheet,
         so when it was slow the icons showed as their ligature names. Only the
         body face still comes from Google, and it is `swap`, so text paints
         immediately in the fallback. -->
    <link rel="preload" href="/fonts/material-symbols-rounded-v8.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The reading faces are loaded without blocking: a stylesheet from a
         third party must never hold up the first paint. Mukta Malar carries
         Tamil and Latin; the Malayalam and Urdu faces are listed too because
         the UI font has no glyphs for those scripts. Google only downloads a
         face once a matching glyph is painted, so non-readers pay nothing. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;500;700&family=Noto+Sans+Malayalam:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;500;700&family=Noto+Sans+Malayalam:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap"
      media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;500;700&family=Noto+Sans+Malayalam:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" />
    </noscript>

    <style>
      /*
        Initial-paint loader. Inline and dependency-free on purpose: this has to
        render before the CSS bundle and the JS bundle have downloaded, or the
        whole point of having it is lost. React removes #boot-loader once it has
        mounted, so there is no flash and no layout shift.

        Duplicated deliberately rather than shared with the app stylesheet - a
        <link> to a stylesheet that has not loaded yet cannot style anything.
        Kept byte-identical in behaviour to components/Loader.jsx.
      */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        gap: 0.875rem;
        background: #f8fafc;
      }
      #boot-loader[hidden] { display: none; }

      /*
        The loader has to respect the theme too. It is the first thing painted,
        so hard-coding a light background produced a full-screen white flash for
        dark-mode readers before the app took over - the exact thing the
        pre-paint script above exists to prevent.
      */
      [data-theme="dark"] #boot-loader { background: #0b1120; }
      [data-theme="dark"] #boot-loader .track { stroke: #1e293b; }
      [data-theme="dark"] #boot-loader .label { color: #94a3b8; }

      #boot-loader .ring {
        position: relative;
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
      }
      #boot-loader .ring > svg.spinner {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      #boot-loader circle { fill: none; stroke-width: 6; stroke-linecap: round; }
      #boot-loader .track { stroke: #e2e8f0; }
      #boot-loader .fill {
        /* Follows the accent fill palette once the app stylesheet is in. The
           fill stops stay at their saturated values in both themes, so the
           ring keeps the same shading as the rest of the charts. */
        stroke: var(--accent-fill-1, #0d9488);
        animation: boot-fill 1.1s linear infinite;
      }
      /* The bundle's stylesheet cannot style the first paint, so each accent's
         saturated fill stop is repeated here. These are intentionally not
         redefined for dark mode: the ring must not wash out. */
      [data-accent="blue"] #boot-loader .fill { stroke: #2563eb; }
      [data-accent="violet"] #boot-loader .fill { stroke: #7c3aed; }
      [data-accent="gold"] #boot-loader .fill { stroke: #b45309; }
      [data-accent="rose"] #boot-loader .fill { stroke: #be123c; }
      [data-accent="ocean"] #boot-loader .fill { stroke: #0e7490; }
      #boot-loader .logo {
        /* The brand glyph is an inline SVG, not an icon-font ligature: the
           loader is the first thing painted, and it must not wait for (or
           depend on) a font download. Inlined (rather than an <img>) so its
           fill can follow the accent like the ring does. */
        display: block;
        width: 34px;
        height: 34px;
        color: var(--accent-fill-1, #0d9488);
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      /* Same repeats as the ring: before the bundle loads there is no palette
         to read the accent from, so each accent's saturated stop is spelled
         out here too or the mark would stay teal on every theme. */
      [data-accent="blue"] #boot-loader .logo { color: #2563eb; }
      [data-accent="violet"] #boot-loader .logo { color: #7c3aed; }
      [data-accent="gold"] #boot-loader .logo { color: #b45309; }
      [data-accent="rose"] #boot-loader .logo { color: #be123c; }
      [data-accent="ocean"] #boot-loader .logo { color: #0e7490; }
      #boot-loader .label {
        position: absolute;
        top: calc(50% + 52px);
        font-family: 'Mukta Malar', system-ui, sans-serif;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #64748b;
      }

      @keyframes boot-fill {
        0%   { stroke-dashoffset: 263; }
        50%  { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -263; }
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.45; transform: scale(0.94); }
        50%      { opacity: 1;    transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .fill { animation: none; stroke-dashoffset: 0; }
        #boot-loader .logo { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-busy="true" aria-live="polite">
      <div class="ring">
